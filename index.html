<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WetFloorWatch | Hamilton Intelligence Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    
    <style>
        body { -webkit-font-smoothing: antialiased; font-family: ui-sans-serif, system-ui, sans-serif; }
        .leaflet-container { background: #020617 !important; }
        .leaflet-tile { filter: brightness(0.5) invert(1) contrast(2.8) hue-rotate(200deg) saturate(0.25); }
        .custom-div-icon { background: transparent; border: none; }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #0f172a !important; color: #f8fafc !important; border: 1px solid #1e293b;
        }
        .marker-cluster { background-color: rgba(245, 158, 11, 0.6); border-radius: 50%; font-weight: bold; color: white; display: flex; align-items: center; justify-content: center; border: 2px solid #f59e0b; }
        .supercrawl-fog { animation: pulse-fog 4s infinite alternate ease-in-out; filter: blur(4px); }
        @keyframes pulse-fog { 0% { fill-opacity: 0.15; } 100% { fill-opacity: 0.45; } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col overflow-hidden">

    <!-- HEADER COMMAND CENTER -->
    <header class="bg-slate-950/95 backdrop-blur-md border-b border-slate-800 h-16 flex items-center justify-between px-4 z-20 shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-amber-500/10 p-2 rounded-xl border border-amber-500/30">
                <svg class="w-6 h-6 text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L1 21h22L12 2zm0 3.5L19.5 19h-15L12 5.5z"/><path d="M11 10h2v4h-2zm0 6h2v2h-2z"/></svg>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight text-white flex items-center gap-2">WetFloorWatch</h1>
                <p class="text-[10px] text-slate-400 font-medium hidden sm:block tracking-wide uppercase">Hamilton Threat & Hazard Intelligence</p>
            </div>
        </div>
        <div class="flex items-center space-x-2.5">
            <button id="auth-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs px-3.5 py-2.5 rounded-xl border border-slate-700 transition">Sign In</button>
            <button id="open-report-modal" class="hidden bg-gradient-to-r from-amber-600 to-amber-500 text-slate-950 font-extrabold text-xs px-3.5 py-2.5 rounded-xl transition">Broadcast</button>
        </div>
    </header>

    <div class="flex-1 flex relative overflow-hidden bg-slate-950">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="absolute md:relative inset-y-0 left-0 z-30 w-[420px] bg-slate-900 border-r border-slate-800 flex flex-col shadow-2xl">
            <!-- FILTERS & CONTROLS -->
            <div class="p-3 space-y-3 bg-slate-950/20 border-b border-slate-800 flex-shrink-0">
                <div class="bg-slate-950 border border-slate-700/50 p-2.5 rounded-xl flex items-center justify-between shadow-inner">
                    <div class="flex flex-col">
                        <span class="text-xs font-bold text-slate-200">City-Wide Danger Heatmap</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="heatmap-toggle" checked class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-800 rounded-full peer peer-checked:bg-rose-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-full"></div>
                    </label>
                </div>
            </div>

            <!-- TABS -->
            <div class="px-3 pt-3 flex-shrink-0 bg-slate-950/40 border-b border-slate-800 pb-2">
                <div class="flex gap-1.5 overflow-x-auto scrollbar-hide text-[10px]">
                    <button onclick="switchMainTab('all')" id="main-tab-all" class="main-tab px-2.5 py-1.5 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/40 font-bold transition">All Data</button>
                    <button onclick="switchMainTab('police')" id="main-tab-police" class="main-tab px-2.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 border border-slate-700 font-bold transition">Police/EMS</button>
                    <button onclick="switchMainTab('news')" id="main-tab-news" class="main-tab px-2.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 border border-slate-700 font-bold transition">News</button>
                    <button onclick="switchMainTab('word_of_mouth')" id="main-tab-wom" class="main-tab px-2.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 border border-slate-700 font-bold transition">Word of Mouth</button>
                </div>
            </div>

            <!-- FEED LIST -->
            <div class="flex-1 overflow-y-auto p-3 space-y-2.5 bg-slate-950/40">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[10px] font-bold text-slate-400 uppercase" id="active-count">0 exact records</span>
                </div>
                <div id="feed-list" class="space-y-2"></div>
            </div>
        </aside>

        <!-- MAP CONTAINER -->
        <main class="flex-1 h-full relative">
            <div id="map" class="w-full h-full z-10"></div>
        </main>
    </div>

    <!-- AUTHENTICATION / REPORT MODAL -->
    <div id="report-modal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-slate-950/90 backdrop-blur-sm p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between border-b border-slate-800 pb-3">
                <h3 id="modal-title" class="font-bold text-lg text-white">Sign In / Broadcast</h3>
                <button id="close-modal" class="text-slate-400 hover:text-white">✕</button>
            </div>
            
            <!-- AUTH FORM -->
            <div id="auth-section" class="space-y-3">
                <p class="text-xs text-amber-400">Secure sign-in required to prevent spam.</p>
                <input type="email" id="auth-email" placeholder="Email Address" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200">
                <input type="password" id="auth-pass" placeholder="Password" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200">
                <div class="flex gap-2">
                    <button id="btn-login" class="flex-1 bg-slate-800 text-white font-bold py-2 rounded-xl text-xs">Login</button>
                    <button id="btn-signup" class="flex-1 bg-slate-700 text-white font-bold py-2 rounded-xl text-xs">Register</button>
                </div>
            </div>

            <!-- REPORT FORM (Hidden until authenticated) -->
            <form id="hazard-form" class="hidden space-y-3">
                <select id="hazard-type" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200">
                    <option value="hazard">Drug / Hazard</option>
                    <option value="street">Social Intel / Harassment</option>
                    <option value="emergency">Emergency</option>
                </select>
                <input type="text" id="hazard-loc" placeholder="Exact Intersection (e.g. King & MacNab)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200" required>
                <!-- Hidden inputs populated by a real geocoder in production -->
                <input type="hidden" id="selected-lat" value="43.2557">
                <input type="hidden" id="selected-lng" value="-79.8711">
                <textarea id="hazard-desc" placeholder="Specific details. No names, no exact house numbers..." rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200" required></textarea>
                <button type="submit" class="w-full bg-amber-500 text-slate-950 font-extrabold py-3 rounded-xl text-xs">Broadcast Secure Pin</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const app = initializeApp({
            apiKey: "AIzaSyDsUcJX5_sTFZ4gYbetTtQjN95sDD1vuks",
            authDomain: "wetfloorwatch.firebaseapp.com",
            projectId: "wetfloorwatch"
        });
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Map Setup
        const map = L.map('map', { zoomControl: false }).setView([43.2557, -79.8711], 13);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        // Exact Clustering Layer
        const clusterGroup = L.markerClusterGroup({ maxClusterRadius: 30 });
        map.addLayer(clusterGroup);
        let heatLayer = null;
        let rawReports = [];
        let currentMainTab = 'all';

        function getIcon(cat) {
            const colors = { emergency: '#dc2626', advisory: '#38bdf8', hazard: '#f59e0b', street: '#d946ef' };
            const color = colors[cat] || '#f59e0b';
            return L.divIcon({
                className: 'custom-div-icon',
                html: `<div class="w-4 h-4 rounded-full border-2 border-slate-900" style="background-color: ${color};"></div>`
            });
        }

        window.switchMainTab = function(tab) {
            currentMainTab = tab;
            document.querySelectorAll('.main-tab').forEach(btn => btn.classList.replace('bg-amber-500/20', 'bg-slate-800'));
            document.querySelectorAll('.main-tab').forEach(btn => btn.classList.replace('text-amber-300', 'text-slate-300'));
            document.querySelectorAll('.main-tab').forEach(btn => btn.classList.replace('border-amber-500/40', 'border-slate-700'));
            
            const activeBtn = document.getElementById(`main-tab-${tab === 'word_of_mouth' ? 'wom' : tab}`);
            activeBtn.classList.replace('bg-slate-800', 'bg-amber-500/20');
            activeBtn.classList.replace('text-slate-300', 'text-amber-300');
            activeBtn.classList.replace('border-slate-700', 'border-amber-500/40');
            
            filterAndRender();
        }

        function filterAndRender() {
            clusterGroup.clearLayers();
            if (heatLayer) map.removeLayer(heatLayer);
            
            const feedContainer = document.getElementById('feed-list');
            feedContainer.innerHTML = '';
            let heatPoints = [];
            let visibleCount = 0;

            rawReports.forEach(item => {
                const p = (item.platform || '').toLowerCase();
                
                if (currentMainTab === 'police' && p !== 'police') return;
                if (currentMainTab === 'news' && p !== 'news') return;
                if (currentMainTab === 'word_of_mouth' && p !== 'word_of_mouth') return;

                visibleCount++;

                if (item.lat && item.lng) {
                    heatPoints.push([item.lat, item.lng, 0.8]);
                    const marker = L.marker([item.lat, item.lng], { icon: getIcon(item.category) });
                    marker.bindPopup(`<strong class="text-xs text-slate-900">${item.source}</strong><p class="text-[11px] text-slate-700 mt-1">${item.description}</p>`);
                    clusterGroup.addLayer(marker);
                }

                const card = document.createElement('div');
                card.className = `p-3 bg-slate-900 border border-slate-800 rounded-xl cursor-pointer hover:border-slate-600 transition`;
                card.innerHTML = `<p class="text-xs font-bold text-slate-200">${item.source}</p><p class="text-[11px] text-slate-400 mt-1">${item.description}</p>`;
                if (item.lat && item.lng) card.onclick = () => map.flyTo([item.lat, item.lng], 16);
                feedContainer.appendChild(card);
            });

            document.getElementById('active-count').innerText = `${visibleCount} exact records`;
            if (document.getElementById('heatmap-toggle').checked && heatPoints.length > 0) {
                heatLayer = L.heatLayer(heatPoints, { radius: 40, blur: 25 }).addTo(map);
            }
        }

        // Live Data Connection
        onSnapshot(query(collection(db, "reports"), orderBy("timestamp", "desc"), limit(100)), (snapshot) => {
            rawReports = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            filterAndRender();
        });
        document.getElementById('heatmap-toggle').onchange = filterAndRender;

        // Modals & Auth
        const modal = document.getElementById('report-modal');
        const authSection = document.getElementById('auth-section');
        const reportForm = document.getElementById('hazard-form');
        
        document.getElementById('auth-btn').onclick = () => {
            if (auth.currentUser) signOut(auth);
            else modal.classList.remove('hidden');
        };
        
        document.getElementById('open-report-modal').onclick = () => modal.classList.remove('hidden');
        document.getElementById('close-modal').onclick = () => modal.classList.add('hidden');

        onAuthStateChanged(auth, user => {
            if (user) {
                document.getElementById('auth-btn').innerText = 'Sign Out';
                document.getElementById('open-report-modal').classList.remove('hidden');
                authSection.classList.add('hidden');
                reportForm.classList.remove('hidden');
                document.getElementById('modal-title').innerText = "Broadcast Field Report";
            } else {
                document.getElementById('auth-btn').innerText = 'Sign In';
                document.getElementById('open-report-modal').classList.add('hidden');
                authSection.classList.remove('hidden');
                reportForm.classList.add('hidden');
                document.getElementById('modal-title').innerText = "Sign In Required";
            }
        });

        // Auth Actions
        document.getElementById('btn-login').onclick = () => signInWithEmailAndPassword(auth, document.getElementById('auth-email').value, document.getElementById('auth-pass').value).catch(e => alert(e.message));
        document.getElementById('btn-signup').onclick = () => createUserWithEmailAndPassword(auth, document.getElementById('auth-email').value, document.getElementById('auth-pass').value).catch(e => alert(e.message));

        // Submit Word of Mouth Report
        reportForm.onsubmit = async (e) => {
            e.preventDefault();
            const desc = document.getElementById('hazard-desc').value.trim();
            if (desc.length < 10) return alert("Description too short.");
            
            try {
                await addDoc(collection(db, "reports"), {
                    category: document.getElementById('hazard-type').value,
                    platform: 'word_of_mouth',
                    hasPin: true,
                    lat: parseFloat(document.getElementById('selected-lat').value),
                    lng: parseFloat(document.getElementById('selected-lng').value),
                    source: `Word of Mouth • Verified Resident`,
                    description: desc,
                    url: '',
                    timestamp: serverTimestamp()
                });
                modal.classList.add('hidden');
                reportForm.reset();
                alert("Verified report published securely.");
            } catch (err) {
                alert("Permission Denied: Backend validation failed.");
            }
        };
    </script>
</body>
</html>
